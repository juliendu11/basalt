name: Build and deploy image

on:
  push:
    branches: [ "master" ]

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./
          push: true
          pull: true
          tags: ghcr.io/juliendu11/basalt:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Wait for image to be pullable on registry
        run: |
          IMAGE="ghcr.io/juliendu11/basalt:latest@${{ steps.build.outputs.digest }}"
          echo "Waiting for $IMAGE to be available..."
          for i in $(seq 1 12); do
            if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
              echo "Image confirmed available on registry."
              exit 0
            fi
            echo "Attempt $i/12: not yet available, retrying in 10s..."
            sleep 10
          done
          echo "Image did not become available in time, deploying anyway..."

      - name: Redeploy app
        run: |
          curl -f -X POST "https://dokploy.julien-dacosta.dev/api/application.redeploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "applicationId": "cKxS-c3MG91xcEiyDPbkp"
            }'

      - name: Redeploy scheduler
        run: |
          curl -f -X POST "https://dokploy.julien-dacosta.dev/api/application.redeploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "applicationId": "-iF56DX8v3kgja96nTQII"
            }'

      - name: Redeploy queue
        run: |
          curl -f -X POST "https://dokploy.julien-dacosta.dev/api/application.redeploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "applicationId": "dtogePYiK74Y0ay7D8Vxh"
            }'
